name: key-system-typecheck
on:
  push:
    branches: [feat/cloudflare-discord-key-system]
    paths: ["key-system/worker/**"]
  pull_request:
    paths: ["key-system/worker/**"]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: key-system/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
