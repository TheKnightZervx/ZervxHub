name: Android app CI

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-ci.yml"]
  push:
    branches: [main, mission3-base]
    paths: ["mobile/**", ".github/workflows/android-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        working-directory: mobile/android
        run: gradle testDebugUnitTest
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle assembleDebug
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: zervxhub-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
