name = "zervxhub-staging"
main = "src/index.ts"
compatibility_date = "2026-11-11"
# Keep the staging Worker offline until an access-controlled HTTPS route is configured.
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "zervxhub-staging-db"
database_id = "ccf340d0-bafc-46ce-96b4-9e41d17b0631"
migrations_dir = "migrations"

[assets]
directory = "../website"
binding = "ASSETS"
run_worker_first = true

[vars]
ALLOWED_UNIVERSE_IDS = ""
